{% extends "base.html" %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card custom-dark-card p-4 rounded mb-4">
        <h1 class="h2 font-weight-bold mb-4 text-center">{{ object|yesno:"Update,Create" }} Adventure</h1>
        <form action="" method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            {{ form.as_p }}
          </div>
          <div class="text-center pt-2">
            <input class="btn btn-warning font-weight-bold px-4" type="submit" value="Submit">
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
