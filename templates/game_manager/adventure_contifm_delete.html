{% extends "base.html" %}

{% block content %}
  <h1>Delete Adventure</h1>
  <p>Are you sure you want to delete {{ adventure }}?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input class="btn btn-primary" type="submit" value="Yes, delete">
    <a class="btn btn-secondary" href="{% url 'game_manager:adventure-list' %}">Cancel</a>
  </form>

{% endblock %}
