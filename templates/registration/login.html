{% extends "base.html" %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card custom-dark-card p-4 rounded mb-4">
        <h1 class="h2 font-weight-bold mb-4 text-center">Login</h1>

        {% if form.errors %}
          <div class="alert alert-danger py-2 px-3 mb-3 text-center" role="alert">
            Your username and password didn't match. Please try again.
          </div>
        {% endif %}

        {% if next %}
          <div class="alert alert-warning py-2 px-3 mb-3 text-center" role="alert">
            Please login to see this page.
          </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <div class="mb-3">
            {{ form.as_p }}
          </div>

          <div class="text-center pt-2">
            <input type="submit" value="Login" class="btn btn-warning font-weight-bold px-4 w-100" />
            <input type="hidden" name="next" value="{{ next }}" />
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
