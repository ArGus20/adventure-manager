<ul class="sidebar-nav list-group">
  {% if user.is_authenticated %}
    <li class="list-group-item">
      User: {{ user.username }}
    </li>
    <li class="list-group-item">
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>

  {% else %}
    <li class="list-group-item">
      <a href="{% url 'login' %}">Login</a>
    </li>
  {% endif %}
  <br>
  <li class="list-group-item">
    <a href="{% url 'game_manager:home-page' %}">Home</a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'game_manager:adventure-list' %}">All adventures</a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'game_manager:master-list' %}">All masters</a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'game_manager:player-list' %}">All players </a>
  </li>
</ul>
